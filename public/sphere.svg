<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="apiGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="1">
        <animate attributeName="stop-color" dur="4s" repeatCount="indefinite" values="#00d4ff;#009ffd;#004e92;#00d4ff"/>
      </stop>
      <stop offset="50%" stop-color="#004e92" stop-opacity="0.8">
        <animate attributeName="stop-color" dur="4s" repeatCount="indefinite" values="#004e92;#0066cc;#000428;#004e92"/>
      </stop>
      <stop offset="100%" stop-color="#000428" stop-opacity="0.6">
        <animate attributeName="stop-color" dur="4s" repeatCount="indefinite" values="#000428;#001f3f;#000a14;#000428"/>
      </stop>
    </radialGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#009ffd" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Background glow -->
  <circle cx="50" cy="50" r="45" fill="url(#glowGradient)"/>
  
  <!-- Main sphere -->
  <circle cx="50" cy="50" r="38" fill="url(#apiGradient)">
    <animate attributeName="r" calcMode="spline" dur="3s" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" repeatCount="indefinite" values="38;40;38"/>
  </circle>
  
  <!-- Circuit board pattern overlay -->
  <g opacity="0.4">
    <!-- Horizontal lines -->
    <line x1="20" y1="35" x2="80" y2="35" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="20" y1="50" x2="80" y2="50" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="20" y1="65" x2="80" y2="65" stroke="#00d4ff" stroke-width="0.5"/>
    
    <!-- Vertical lines -->
    <line x1="35" y1="20" x2="35" y2="80" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="50" y1="20" x2="50" y2="80" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="65" y1="20" x2="65" y2="80" stroke="#00d4ff" stroke-width="0.5"/>
    
    <!-- Connection nodes -->
    <circle cx="35" cy="35" r="1.5" fill="#00ff88">
      <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.3;1;0.3"/>
    </circle>
    <circle cx="50" cy="35" r="1.5" fill="#00ff88">
      <animate attributeName="opacity" dur="2s" begin="0.3s" repeatCount="indefinite" values="0.3;1;0.3"/>
    </circle>
    <circle cx="65" cy="35" r="1.5" fill="#00ff88">
      <animate attributeName="opacity" dur="2s" begin="0.6s" repeatCount="indefinite" values="0.3;1;0.3"/>
    </circle>
    <circle cx="35" cy="50" r="1.5" fill="#00ff88">
      <animate attributeName="opacity" dur="2s" begin="0.9s" repeatCount="indefinite" values="0.3;1;0.3"/>
    </circle>
    <circle cx="50" cy="50" r="2" fill="#00d4ff">
      <animate attributeName="r" dur="2s" repeatCount="indefinite" values="2;2.5;2"/>
    </circle>
    <circle cx="65" cy="50" r="1.5" fill="#00ff88">
      <animate attributeName="opacity" dur="2s" begin="1.2s" repeatCount="indefinite" values="0.3;1;0.3"/>
    </circle>
    <circle cx="35" cy="65" r="1.5" fill="#00ff88">
      <animate attributeName="opacity" dur="2s" begin="1.5s" repeatCount="indefinite" values="0.3;1;0.3"/>
    </circle>
    <circle cx="50" cy="65" r="1.5" fill="#00ff88">
      <animate attributeName="opacity" dur="2s" begin="1.8s" repeatCount="indefinite" values="0.3;1;0.3"/>
    </circle>
    <circle cx="65" cy="65" r="1.5" fill="#00ff88">
      <animate attributeName="opacity" dur="2s" begin="2.1s" repeatCount="indefinite" values="0.3;1;0.3"/>
    </circle>
  </g>
  
  <!-- API text in center -->
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">
    API
  </text>
</svg>
